<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Labyrinth Survivor</title>
    <style>
      /* The game fills the browser window at any size: no fixed 1280x720 box, no scrollbars, nothing cut off. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #09070a; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #09070a; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 gap: 18px; color: #c9a45c; font-family: "Yu Mincho", "Hiragino Mincho ProN", serif; pointer-events: none; }
      #loading h1 { margin: 0; font-size: clamp(28px, 6vw, 64px); letter-spacing: 0.06em; color: #b8913f; }
      #bar { width: min(420px, 70vw); height: 6px; background: #241c14; border: 1px solid #5a4526; }
      #fill { width: 0%; height: 100%; background: #d9a441; transition: width 0.2s; }
      #status { font-size: 15px; color: #8f8576; }
      #error { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); max-width: 90vw; padding: 10px 16px;
               background: #5a1414; color: #fff; font-family: sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>LABYRINTH SURVIVOR</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">読み込み中…</div>
    </div>
    <div id="error"></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      function showBanner(msg, type) {
        if (type !== "error") { console.warn(msg); return; }
        var e = document.querySelector("#error");
        e.textContent = msg;
        e.style.display = "block";
      }

      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // Pixel art is upscaled from a small render target anyway; cap very high-DPI screens to keep it fast.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
        document.querySelector("#status").textContent = "読み込み中… " + Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        showBanner(message, "error");
      });
    </script>
  </body>
</html>
